<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Mint Canvas</title>

  <script>
  (function() {
    function getParentTheme() {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const qTheme = urlParams.get('theme');
        if (qTheme === 'light' || qTheme === 'dark') return qTheme;

        const parentTheme = window.parent?.localStorage?.getItem('mcustock_theme') || localStorage.getItem('mcustock_theme');
        if (parentTheme === 'light' || parentTheme === 'dark') return parentTheme;
        if (window.parent?.document?.documentElement?.classList?.contains('light')) return 'light';
        if (document.documentElement.classList.contains('light')) return 'light';
      } catch {}
      return 'dark';
    }

    let activeTheme = getParentTheme();
    try {
      localStorage.setItem('photocraft-theme', activeTheme);
      localStorage.setItem('mcustock_theme', activeTheme);
    } catch {}

    const origMatchMedia = window.matchMedia ? window.matchMedia.bind(window) : null;
    window.matchMedia = function(query) {
      if (query && query.includes('prefers-color-scheme')) {
        const isDarkQuery = query.includes('dark');
        const matches = isDarkQuery ? (activeTheme === 'dark') : (activeTheme === 'light');
        return {
          matches: matches,
          media: query,
          onchange: null,
          addListener: function() {},
          removeListener: function() {},
          addEventListener: function() {},
          removeEventListener: function() {},
          dispatchEvent: function() { return true; }
        };
      }
      return origMatchMedia ? origMatchMedia(query) : { matches: false, media: query };
    };

    function applyTheme(theme) {
      activeTheme = theme;
      try {
        localStorage.setItem('photocraft-theme', theme);
        localStorage.setItem('mcustock_theme', theme);
      } catch {}
      const isDark = theme === 'dark';
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        if (document.body) document.body.style.background = '#101116';
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
        if (document.body) document.body.style.background = '#f7fbf9';
      }
    }

    function setupFullscreenBtn() {
      const btn = document.getElementById('mint_canvas_fs_btn');
      if (!btn) return;

      const enterIcon = btn.querySelector('.fs-enter');
      const exitIcon = btn.querySelector('.fs-exit');

      function alignFsBtn() {
        const offset = window.innerWidth > 1200 ? 191 : 166;
        btn.style.right = (offset + 36) + 'px';
      }

      function updateFsIcons(isFs) {
        if (enterIcon) enterIcon.style.display = isFs ? 'none' : 'block';
        if (exitIcon) exitIcon.style.display = isFs ? 'block' : 'none';
        btn.title = isFs ? 'Exit Fullscreen' : 'Enter Fullscreen';
      }

      btn.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({ type: 'mint-canvas:toggle-fullscreen' }, '*');
        } else {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.();
          } else {
            document.exitFullscreen?.();
          }
        }
      });

      alignFsBtn();
      window.addEventListener('resize', alignFsBtn);

      document.addEventListener('fullscreenchange', () => {
        updateFsIcons(!!document.fullscreenElement);
      });

      window.addEventListener('message', (event) => {
        if (event.data?.type === 'mint-canvas:fullscreen-state') {
          updateFsIcons(!!event.data.isFullscreen);
        }
      });
    }

    function triggerThemeToggle() {
      const canvas = document.getElementById('photocraft_canvas');
      if (!canvas) return;
      const rect = canvas.getBoundingClientRect();
      const offset = window.innerWidth > 1200 ? 191 : 166;
      const x = rect.right - offset;
      const y = rect.top + 14;
      const opts = { clientX: x, clientY: y, screenX: x, screenY: y, bubbles: true, cancelable: true, view: window, button: 0, buttons: 1 };
      ['pointerover', 'pointerenter', 'pointermove', 'pointerdown', 'mousedown', 'pointerup', 'mouseup', 'click'].forEach((type) => {
        const isUp = type.includes('up') || type === 'click';
        const curOpts = { ...opts, buttons: isUp ? 0 : 1 };
        const evt = type.startsWith('pointer')
          ? new PointerEvent(type, { ...curOpts, pointerId: 1, pointerType: 'mouse', isPrimary: true })
          : new MouseEvent(type, curOpts);
        canvas.dispatchEvent(evt);
      });
      console.log('Triggered theme toggle click at', x, y, '(offset:', offset, ')');
    }
    window.__triggerThemeToggle = triggerThemeToggle;

    window.addEventListener('TrunkApplicationStarted', () => {
      console.log('TrunkApplicationStarted fired! activeTheme:', activeTheme);
      if (activeTheme === 'light') {
        setTimeout(() => {
          triggerThemeToggle();
        }, 1200);
      }
    });

    document.addEventListener('DOMContentLoaded', () => {
      applyTheme(activeTheme);
      setupFullscreenBtn();
      try {
        window.parent?.postMessage({ type: 'mint-canvas:ready' }, '*');
      } catch {}
    });

    window.addEventListener('message', (event) => {
      if ((event.data?.type === 'mint-canvas:theme' || event.data?.type === 'mcustock:theme') && (event.data.mode === 'dark' || event.data.mode === 'light')) {
        if (event.data.mode !== activeTheme) {
          activeTheme = event.data.mode;
          try {
            localStorage.setItem('photocraft-theme', activeTheme);
            localStorage.setItem('mcustock_theme', activeTheme);
          } catch {}
          window.location.reload();
        } else {
          applyTheme(event.data.mode);
        }
      }
    });

    try {
      Object.defineProperty(navigator, 'gpu', { get: () => undefined, configurable: true });
    } catch {}

    const origGetContext = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function(type) {
      console.log('HTMLCanvasElement getContext:', type);
      return origGetContext.apply(this, arguments);
    };

    function hookShaderSource(proto, name) {
      if (typeof proto === 'undefined' || !proto.shaderSource) return;
      const orig = proto.shaderSource;
      proto.shaderSource = function(shader, source) {
        if (typeof source === 'string') {
          if (source.includes('out_color_gamma =') && source.includes('dither_interleaved')) {
            console.log('Hooking egui UI shader in', name);
            const eguiRegex = /vec4\s+([a-zA-Z0-9_]+)\s*=\s*out_color_gamma\s*;\s*([a-zA-Z0-9_]+)\s*=\s*\1\s*;/;
            source = source.replace(eguiRegex, (match, vName, outName) => {
              return `vec4 ${vName} = out_color_gamma;
    if (${vName}.b > 0.60 && (${vName}.b - ${vName}.r) > 0.28 && (${vName}.b - ${vName}.g) > 0.12) {
        float t = clamp((${vName}.b - 0.60) / 0.38, 0.0, 1.0);
        vec3 mint = mix(vec3(0.086, 0.780, 0.518), vec3(0.153, 0.890, 0.604), t);
        ${vName}.rgb = mint * ${vName}.a;
    }
    ${outName} = ${vName};`;
            });
          }
        }
        return orig.apply(this, arguments);
      };
    }

    if (typeof WebGL2RenderingContext !== 'undefined') hookShaderSource(WebGL2RenderingContext.prototype, 'WebGL2');
    if (typeof WebGLRenderingContext !== 'undefined') hookShaderSource(WebGLRenderingContext.prototype, 'WebGL');
  })();
  </script>

  <script type="module">
  import init, * as bindings from './photocraft-web-f8b893e17055c08f.js';
  const wasm = await init({ module_or_path: './photocraft-web-f8b893e17055c08f_bg.wasm' });

  window.wasmBindings = bindings;
  dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));
  </script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #101116;
      color: #f8fafc;
    }
    html.light, html.light body {
      background: #f7fbf9;
      color: #071b17;
    }
    #photocraft_canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      display: block;
    }
    #photocraft_loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      text-align: center;
      color: #a8b1c4;
      font: 14px system-ui, sans-serif;
      pointer-events: none;
    }
    #photocraft_loading p {
      margin: 0 0 8px;
      max-width: 420px;
      line-height: 1.5;
    }
    #photocraft_loading a {
      color: #16c784;
      pointer-events: auto;
    }
    #photocraft_stalled {
      color: #64748b;
      visibility: hidden;
      animation: photocraft-stalled 0s 20s forwards;
    }
    @keyframes photocraft-stalled {
      to { visibility: visible; }
    }
    #mint_canvas_fs_btn {
      position: fixed;
      top: 4px;
      right: 228px;
      width: 28px;
      height: 23px;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2d3847;
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      cursor: pointer;
      padding: 0;
      transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
      outline: none;
    }
    #mint_canvas_fs_btn:hover {
      background: #394759;
      color: #24dc96;
      border-color: rgba(36, 220, 150, 0.5);
    }
    html.light #mint_canvas_fs_btn {
      background: #c8d8ef;
      color: #334155;
      border-color: rgba(0, 0, 0, 0.1);
    }
    html.light #mint_canvas_fs_btn:hover {
      background: #b5cbe8;
      color: #16c784;
      border-color: rgba(22, 199, 132, 0.5);
    }
  </style>

<body>
  <canvas id="photocraft_canvas"></canvas>
  <button id="mint_canvas_fs_btn" aria-label="Toggle Fullscreen" title="Full screen">
    <svg class="fs-icon fs-enter" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7" />
    </svg>
    <svg class="fs-icon fs-exit" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
      <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7" />
    </svg>
  </button>
  <div id="photocraft_loading">
    <p>Loading Mint Canvas&hellip;</p>
    <p id="photocraft_stalled">This is taking longer than usual. If Mint Canvas doesn't start, its files may have failed to download. <a href="">Reload</a> to try again.</p>
  </div>
</body>
